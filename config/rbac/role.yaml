---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resourceNames:
  - mongodb-operator-2-controller-manager
  resources:
  - serviceaccounts/token
  verbs:
  - create
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs/finalizers
  verbs:
  - update
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - create
  - delete
  - get
  - update
