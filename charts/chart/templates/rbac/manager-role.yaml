{{- if .Values.rbac.namespaced }}
{{- fail "rbac.namespaced=true is incompatible with instance-manager TokenReview and SubjectAccessReview permissions; use cluster-scoped RBAC" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "mongodb-operator-2.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - create
  - delete
  - get
  - update
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  resourceNames:
  - {{ include "mongodb-operator-2.serviceAccountName" . }}
  verbs:
  - create
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs/finalizers
  verbs:
  - update
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs/status
  verbs:
  - get
  - patch
  - update
