apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "mongodb-operator-2.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs/finalizers
  verbs:
  - update
- apiGroups:
  - db.mrhachi.dev
  resources:
  - mongodbs/status
  verbs:
  - get
  - patch
  - update
