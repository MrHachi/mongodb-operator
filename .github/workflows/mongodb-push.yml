name: MongoDB Push

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - .github/workflows/mongodb-push.yml
      - .github/workflows/mongodb-tag.yml
      - database/**

permissions:
  contents: read
  packages: write

jobs:
  push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Repository owner name to lowercase
        id: preprocessing
        env:
          GITHUB_REPOSITORY_OWNER: "${{ github.repository_owner }}"
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          echo "Repository owner (lowercase): ${GITHUB_REPOSITORY_OWNER,,}"

      - name: Install QEMU binaries
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: database
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ steps.preprocessing.outputs.owner }}/mongodb:${{ github.sha }}
          push: true
