name: MongoDB Push

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - database/**

permissions:
  contents: read
  packages: write

jobs:
  push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: database
          tags: ghcr.io/${{ github.repository_owner }}/mongodb:${{ github.sha }}
          push: true
